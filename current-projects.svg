
<svg xmlns="http://www.w3.org/2000/svg"
     width="940"
     height="538"
     viewBox="0 0 940 538"
     role="img"
     aria-label="Current AI Engineering Projects by Ganesh Pokharel">

  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFD"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 21px;
        font-weight: 700;
        fill: #172B45;
      }

      .description {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        fill: #52657B;
      }

      .category {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        letter-spacing: 1.4px;
        fill: #6E8299;
      }

      .status {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        letter-spacing: 0.7px;
        fill: #64748B;
      }

      .completed {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        fill: #047857;
      }
    </style>

    <g id="card">
      <rect width="438" height="150"
            rx="14"
            fill="url(#card-bg)"
            stroke="#DCE5EF"
            stroke-width="1.2"/>

      <rect x="0.7" y="0.7"
            width="436.6" height="148.6"
            rx="13"
            fill="none"
            stroke="#0891B2"
            stroke-width="1.4">
        <animate attributeName="opacity"
                 values="0.08;0.25;0.08"
                 dur="7s"
                 repeatCount="indefinite"/>
      </rect>
    </g>
  </defs>

  <!-- Light background -->
  <rect width="940"
        height="538"
        rx="18"
        fill="#F3F7FB"/>

  <!-- Subtle grid -->
  <path d="M0 134.5 H940 M0 269 H940 M0 403.5 H940"
        stroke="#E2EAF3"
        stroke-width="0.7"/>

  <path d="M235 0 V538 M470 0 V538 M705 0 V538"
        stroke="#E2EAF3"
        stroke-width="0.7"/>


  <!-- 01: QAOPS AGENT -->
  <g transform="translate(22 22)">
    <use href="#card"/>

    <rect x="24" y="0" width="54" height="2"
          rx="1" fill="url(#accent)">
      <animate attributeName="x"
               values="24;360;24"
               dur="9s" begin="0s"
               repeatCount="indefinite"/>
    </rect>

    <text x="24" y="34" class="category">
      01 / AGENTIC QA
    </text>

    <text x="414" y="34"
          text-anchor="end"
          class="status">
      IN DEVELOPMENT
    </text>

    <text x="24" y="70" class="title">
      qaops-agent
    </text>

    <text x="24" y="104" class="description">
      AI-assisted testing · API execution
    </text>

    <text x="24" y="128" class="description">
      Regression detection · QA automation
    </text>
  </g>


  <!-- 02: EVIDHARA -->
  <g transform="translate(480 22)">
    <use href="#card"/>

    <rect x="24" y="0" width="54" height="2"
          rx="1" fill="url(#accent)">
      <animate attributeName="x"
               values="24;360;24"
               dur="9s" begin="1.5s"
               repeatCount="indefinite"/>
    </rect>

    <text x="24" y="34" class="category">
      02 / LEGAL INTELLIGENCE
    </text>

    <text x="414" y="34"
          text-anchor="end"
          class="status">
      IN DEVELOPMENT
    </text>

    <text x="24" y="70" class="title">
      evidhara
    </text>

    <text x="24" y="104" class="description">
      Source-grounded legal research
    </text>

    <text x="24" y="128" class="description">
      Precedent and evidence workflows
    </text>
  </g>


  <!-- 03: GIVANTA -->
  <g transform="translate(22 194)">
    <use href="#card"/>

    <rect x="24" y="0" width="54" height="2"
          rx="1" fill="url(#accent)">
      <animate attributeName="x"
               values="24;360;24"
               dur="9s" begin="3s"
               repeatCount="indefinite"/>
    </rect>

    <text x="24" y="34" class="category">
      03 / AI-POWERED SAAS
    </text>

    <text x="414" y="34"
          text-anchor="end"
          class="status">
      IN DEVELOPMENT
    </text>

    <text x="24" y="70" class="title">
      Givanta
    </text>

    <text x="24" y="104" class="description">
      Multi-tenant lead workflows
    </text>

    <text x="24" y="128" class="description">
      AI-assisted business operations
    </text>
  </g>


  <!-- 04: SOCIAL MEDIA AUTOMATION -->
  <g transform="translate(480 194)">
    <use href="#card"/>

    <rect x="24" y="0" width="54" height="2"
          rx="1" fill="url(#accent)">
      <animate attributeName="x"
               values="24;360;24"
               dur="9s" begin="4.5s"
               repeatCount="indefinite"/>
    </rect>

    <text x="24" y="34" class="category">
      04 / WORKFLOW AUTOMATION
    </text>

    <text x="414" y="34"
          text-anchor="end"
          class="status">
      IN DEVELOPMENT
    </text>

    <text x="24" y="70" class="title">
      social-media-automation
    </text>

    <text x="24" y="104" class="description">
      Social media process automation
    </text>

    <text x="24" y="128" class="description">
      Content and operational workflows
    </text>
  </g>


  <!-- 05: SKILLSATHI AI -->
  <g transform="translate(22 366)">
    <use href="#card"/>

    <rect x="24" y="0" width="54" height="2"
          rx="1" fill="url(#accent)">
      <animate attributeName="x"
               values="24;360;24"
               dur="9s" begin="6s"
               repeatCount="indefinite"/>
    </rect>

    <text x="24" y="34" class="category">
      05 / EDUCATION AI
    </text>

    <text x="414" y="34"
          text-anchor="end"
          class="completed">
      DEVELOPMENT COMPLETE
    </text>

    <text x="24" y="70" class="title">
      skillsathi-ai
    </text>

    <text x="24" y="104" class="description">
      Bilingual RAG chatbot for SkillShikshya
    </text>

    <text x="24" y="128" class="description">
      Automatic website content sync
    </text>
  </g>


  <!-- 06: PERSONAL STOCK AI -->
  <g transform="translate(480 366)">
    <use href="#card"/>

    <rect x="24" y="0" width="54" height="2"
          rx="1" fill="url(#accent)">
      <animate attributeName="x"
               values="24;360;24"
               dur="9s" begin="7.5s"
               repeatCount="indefinite"/>
    </rect>

    <text x="24" y="34" class="category">
      06 / FINANCIAL INTELLIGENCE
    </text>

    <text x="414" y="34"
          text-anchor="end"
          class="status">
      IN DEVELOPMENT
    </text>

    <text x="24" y="70" class="title">
      personal-stock-ai
    </text>

    <text x="24" y="104" class="description">
      AI-assisted stock analysis
    </text>

    <text x="24" y="128" class="description">
      Financial data exploration and insights
    </text>
  </g>

</svg>
